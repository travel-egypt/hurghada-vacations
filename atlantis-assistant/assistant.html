<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#b18b4c"><link rel="manifest" href="assistant.webmanifest"><link rel="apple-touch-icon" href="assistant-192.png"><title>Atlantis · Travel Concierge</title><style>

</style></head><body><main><header><img src="assistant-192.png" alt="Atlantis"><div><h1>Atlantis Travel Concierge</h1><small>Digital assistant · Offline edition</small></div></header><nav><select id="lang" aria-label="Language"><option value="en">English</option><option value="ar">العربية</option><option value="de">Deutsch</option><option value="fr">Français</option><option value="it">Italiano</option><option value="es">Español</option><option value="pl">Polski</option><option value="ru">Русский</option></select><button id="install" hidden>Install / تثبيت</button><button id="clear">↻</button></nav><div id="state" role="status"></div><small id="hint"></small><section id="chat" role="log" aria-live="polite"></section><form id="form"><input id="q" required maxlength="500" autocomplete="off" dir="auto" aria-label="Question"><button id="send">Send</button></form><a href="https://wa.me/201557745501" id="human">Atlantis team · WhatsApp (online)</a></main><script src="assistant-knowledge.js"></script><script>
const $=id=>document.getElementById(id), langs=['en','ar','de','fr','it','es','pl','ru'];let l=langs.includes(navigator.language.slice(0,2))?navigator.language.slice(0,2):'en';$('lang').value=l;const ui=[['Hi! I’m the Atlantis digital travel assistant. Ask me about Hurghada or our trips.','Ask a question','Send','I’m not sure about that yet. Please ask the Atlantis team for a reliable answer.','Offline answers are limited; live prices and bookings need internet.'],['أهلاً بيك! أنا المساعد الرقمي لأتلانتس. اسألني عن الغردقة أو الرحلات.','اكتب سؤالك','إرسال','مش متأكد من الإجابة دي. اسأل فريق أتلانتس عشان تاخد معلومة مظبوطة.','الردود أوفلاين محدودة؛ الأسعار الحالية والحجز محتاجين إنترنت.'],['Hallo! Ich bin der digitale Reiseassistent von Atlantis. Frag mich nach Hurghada oder Ausflügen.','Deine Frage','Senden','Da bin ich mir nicht sicher. Frag bitte beim Atlantis-Team nach.','Aktuelle Preise und Buchungen brauchen Internet.'],['Salut ! Je suis l’assistant numérique Atlantis. Pose-moi tes questions sur Hurghada.','Ta question','Envoyer','Je ne suis pas sûr. Demande à l’équipe Atlantis.','Les prix actuels et réservations nécessitent Internet.'],['Ciao! Sono l’assistente digitale Atlantis. Chiedimi di Hurghada.','La tua domanda','Invia','Non ne sono sicuro. Chiedi al team Atlantis.','Prezzi aggiornati e prenotazioni richiedono Internet.'],['¡Hola! Soy el asistente digital de Atlantis. Pregúntame sobre Hurghada.','Tu pregunta','Enviar','No estoy seguro. Consulta al equipo Atlantis.','Los precios actuales y las reservas requieren internet.'],['Cześć! Jestem cyfrowym asystentem Atlantis. Zapytaj o Hurghadę.','Twoje pytanie','Wyślij','Nie mam pewności. Zapytaj zespół Atlantis.','Aktualne ceny i rezerwacje wymagają internetu.'],['Привет! Я цифровой помощник Atlantis. Спрашивай о Хургаде.','Твой вопрос','Отправить','Я не уверен. Лучше уточнить у команды Atlantis.','Актуальные цены и бронирование требуют интернета.']];function add(t,user=false){let a=document.createElement('article');a.dir='auto';a.className=user?'user':'';a.textContent=t;$('chat').append(a);a.scrollIntoView({block:'nearest'});}function reset(){let u=ui[langs.indexOf(l)];document.documentElement.lang=l;document.documentElement.dir=l==='ar'?'rtl':'ltr';$('chat').replaceChildren();$('q').placeholder=u[1];$('send').textContent=u[2];$('hint').textContent=u[4];add(u[0]);}$('lang').onchange=()=>{l=$('lang').value;reset()};$('clear').onclick=reset;function norm(s){return s.toLowerCase().normalize('NFD').replace(/\p{M}/gu,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/[^\p{L}\p{N}]+/gu,' ').trim()}$('form').onsubmit=e=>{e.preventDefault();let q=$('q').value.trim();if(!q)return;add(q,true);$('q').value='';let i=langs.indexOf(l),n=norm(q),hits=knowledge.map(r=>({r,s:Math.max(0,...r[i][0].split('|').map(k=>{let p=norm(k);return (' '+n+' ').includes(' '+p+' ')?p.length:0}))})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s);add(hits.length?hits.slice(0,2).map(x=>x.r[i][1]).join('\n\n'):ui[i][3]);};reset();let promptEvent;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();promptEvent=e;$('install').hidden=false});$('install').onclick=async()=>{if(promptEvent){await promptEvent.prompt();promptEvent=null;$('install').hidden=true}};if('serviceWorker'in navigator){navigator.serviceWorker.register('assistant-sw.js',{scope:'./'}).then(()=>navigator.serviceWorker.ready).then(()=>{$('state').textContent='Offline files ready / ملفات الأوفلاين جاهزة'}).catch(()=>{$('state').textContent='Offline setup failed / تعذر تجهيز الأوفلاين'})}
</script></body></html>
