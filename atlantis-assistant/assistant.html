<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#b18b4c"><link rel="manifest" href="assistant.webmanifest"><link rel="apple-touch-icon" href="assistant-192.png"><title>Atlantis Intelligence V5 · Travel Concierge</title><style>
*{box-sizing:border-box} [hidden]{display:none!important} :root{color-scheme:light;--ink:#34271b;--muted:#665238;--gold:#a77a37;--line:#bca37a;--sand:#dfceb0} body{margin:0;background:radial-gradient(ellipse at top,#eadcc2,#cbb38a);color:var(--ink);font:15px/1.65 system-ui,sans-serif} main{max-width:900px;margin:auto;min-height:100dvh;display:flex;flex-direction:column;padding:24px;gap:12px} header{display:flex;align-items:center;gap:14px;padding:18px;border:1px solid var(--line);border-radius:22px;background:#d6bd92} header img{width:58px;height:58px;border-radius:16px} h1{font-size:clamp(19px,3vw,27px);font-weight:550;margin:0;letter-spacing:.01em} small{color:var(--muted)} nav{display:flex;gap:8px;flex-wrap:wrap;align-items:center} select,input,button{font:inherit;color:inherit;border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:#e9d9bc} button{cursor:pointer;background:#b78b49;color:#24190d;font-weight:600} button:disabled{opacity:.65;cursor:default} button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #75501e;outline-offset:2px} #ai-load{align-self:stretch;background:#c39d60} #ai-status{display:block;overflow-wrap:anywhere;white-space:pre-wrap;padding:8px 12px;border-inline-start:3px solid var(--gold);background:#e6d4b4;border-radius:8px} #chat{flex:1;min-height:40vh;display:flex;flex-direction:column;gap:14px;padding:18px 4px} article{padding:14px 18px;border:1px solid #cdb58d;border-radius:18px 18px 18px 5px;background:#eadbc1;max-width:88%;align-self:flex-start;white-space:pre-wrap;overflow-wrap:anywhere} article.user{align-self:flex-end;background:#c7a36b;border-radius:18px 18px 5px 18px} article:empty{min-width:70px;min-height:44px} article:empty:after{content:'•••';letter-spacing:5px;animation:pulse 1.1s infinite alternate} @keyframes pulse{from{opacity:.3}to{opacity:1}} form{display:flex;gap:8px;position:sticky;bottom:0;background:#d9c5a2;padding:12px;border:1px solid var(--line);border-radius:18px;z-index:2} input{flex:1;min-width:0;background:#ecdec5} a{color:#563b16;text-underline-offset:4px} #state,#hint{font-size:12px} #human{text-align:center;font-size:13px;padding:6px} #clear{min-width:44px} @media(max-width:500px){main{padding:10px;gap:9px}header{padding:12px}header img{width:44px;height:44px}article{max-width:94%}form{padding:8px;gap:5px}form button{padding:9px}input{padding:9px;font-size:16px}} @media(prefers-reduced-motion:reduce){article:empty:after{animation:none}}
</style></head><body><main><header><img src="assistant-192.png" alt="Atlantis"><div><h1>Atlantis Travel Concierge</h1><small>Atlantis Intelligence V5 · Local AI</small></div></header><nav><select id="lang" aria-label="Language"><option value="en">English</option><option value="ar">العربية</option><option value="de">Deutsch</option><option value="fr">Français</option><option value="it">Italiano</option><option value="es">Español</option><option value="pl">Polski</option><option value="ru">Русский</option></select><button id="install" type="button" hidden>Install / تثبيت</button><button id="clear" type="button" aria-label="New conversation" title="New conversation">↻</button></nav><button id="ai-load" type="button">Local AI</button><small id="ai-status" role="status">Optional AI · WebGPU · large initial download · AI may make mistakes</small><div id="state" role="status"></div><small id="hint"></small><section id="chat" role="log" aria-live="polite"></section><form id="form"><input id="q" required maxlength="500" autocomplete="off" dir="auto" aria-label="Question"><button id="send">Send</button></form><a href="https://wa.me/201557745501" id="human">Atlantis team · WhatsApp (online)</a></main><script src="assistant-knowledge.js"></script><script>
const $=id=>document.getElementById(id), langs=['en','ar','de','fr','it','es','pl','ru'];let l=langs.includes(navigator.language.slice(0,2))?navigator.language.slice(0,2):'en';$('lang').value=l;const ui=[['Hi! I’m the Atlantis digital travel assistant. Ask me about travel or anything you are curious about.','Ask a question','Send','I’m not sure about that yet. Please ask the Atlantis team for a reliable answer.','Offline answers are limited; live prices and bookings need internet.'],['أهلاً بيك! أنا المساعد الرقمي لأتلانتس. اسألني عن السفر أو أي موضوع حابب تعرف عنه.','اكتب سؤالك','إرسال','مش متأكد من الإجابة دي. اسأل فريق أتلانتس عشان تاخد معلومة مظبوطة.','الردود أوفلاين محدودة؛ الأسعار الحالية والحجز محتاجين إنترنت.'],['Hallo! Ich bin der digitale Reiseassistent von Atlantis. Frag mich nach Hurghada oder Ausflügen.','Deine Frage','Senden','Da bin ich mir nicht sicher. Frag bitte beim Atlantis-Team nach.','Aktuelle Preise und Buchungen brauchen Internet.'],['Salut ! Je suis l’assistant numérique Atlantis. Pose-moi tes questions sur Hurghada.','Ta question','Envoyer','Je ne suis pas sûr. Demande à l’équipe Atlantis.','Les prix actuels et réservations nécessitent Internet.'],['Ciao! Sono l’assistente digitale Atlantis. Chiedimi di Hurghada.','La tua domanda','Invia','Non ne sono sicuro. Chiedi al team Atlantis.','Prezzi aggiornati e prenotazioni richiedono Internet.'],['¡Hola! Soy el asistente digital de Atlantis. Pregúntame sobre Hurghada.','Tu pregunta','Enviar','No estoy seguro. Consulta al equipo Atlantis.','Los precios actuales y las reservas requieren internet.'],['Cześć! Jestem cyfrowym asystentem Atlantis. Zapytaj o Hurghadę.','Twoje pytanie','Wyślij','Nie mam pewności. Zapytaj zespół Atlantis.','Aktualne ceny i rezerwacje wymagają internetu.'],['Привет! Я цифровой помощник Atlantis. Спрашивай о Хургаде.','Твой вопрос','Отправить','Я не уверен. Лучше уточнить у команды Atlantis.','Актуальные цены и бронирование требуют интернета.']];function add(t,user=false){let a=document.createElement('article');a.dir='auto';a.className=user?'user':'';a.textContent=t;$('chat').append(a);a.scrollIntoView({block:'nearest'});}function reset(){let u=ui[langs.indexOf(l)];document.documentElement.lang=l;document.documentElement.dir=l==='ar'?'rtl':'ltr';$('chat').replaceChildren();$('q').placeholder=u[1];$('send').textContent=u[2];$('hint').textContent=u[4];add(u[0]);}$('lang').onchange=()=>{l=$('lang').value;reset()};$('clear').onclick=reset;function norm(s){return s.toLowerCase().normalize('NFD').replace(/\p{M}/gu,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/[^\p{L}\p{N}]+/gu,' ').trim()}$('form').onsubmit=e=>{e.preventDefault();let q=$('q').value.trim();if(!q)return;add(q,true);$('q').value='';let i=langs.indexOf(l),n=norm(q);const words=n.split(' ');function stem(w){return w.replace(/^(وال|بال|لل|ال)/,'').replace(/^(و)(?=.{4})/,'')}function score(k){let p=norm(k);if((' '+n+' ').includes(' '+p+' '))return 10+p.length;let kw=p.split(' ');if(kw.every(t=>words.some(w=>stem(w)===stem(t))))return 8+p.length;return 0}let hits=(typeof knowledge!=='undefined'&&Array.isArray(knowledge)?knowledge:[]).map(r=>({r,s:Math.max(0,...r[i][0].split('|').map(score))})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s);add(hits.length?hits.slice(0,3).map(x=>x.r[i][1]).join('\n\n'):ui[i][3]);};reset();let promptEvent;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();promptEvent=e;$('install').hidden=false});$('install').onclick=async()=>{if(promptEvent){await promptEvent.prompt();promptEvent=null;$('install').hidden=true}};if('serviceWorker'in navigator){navigator.serviceWorker.register('assistant-sw.js',{scope:'./'}).then(()=>navigator.serviceWorker.ready).then(()=>{$('state').textContent='App files cached · AI offline availability depends on model cache / ملفات التطبيق محفوظة'}).catch(()=>{$('state').textContent='Offline setup failed / تعذر تجهيز الأوفلاين'})}
</script><script src="assistant-ai.js"></script></body></html>
