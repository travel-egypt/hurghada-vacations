 for scuba activities."}]</script><script>const $=x=>document.getElementById(x), seed=JSON.parse($('seed').textContent),key='atlantis:studio:v1';let data=structuredClone(seed),selected=null;try{const v=JSON.parse(localStorage.getItem(key));if(Array.isArray(v)&&v.length)data=v}catch{}const fields=['title','desc','detail','image'];function store(){try{localStorage.setItem(key,JSON.stringify(data));$('status').textContent='تم الحفظ في هذا المتصفح فقط.'}catch{$('status').textContent='تعذر التخزين المحلي؛ صدّر الملف الآن.'}}function render(){ $('count').textContent=data.length;$('priced').textContent=data.filter(x=>typeof x.price==='number').length;$('unknown').textContent=data.length-Number($('priced').textContent);$('list').replaceChildren();const q=$('search').value.toLowerCase();for(const x of data.filter(x=>(x.title+' '+x.category).toLowerCase().includes(q))){const b=document.createElement('button');b.textContent=x.title;b.className=x.id===selected?'selected':'';b.onclick=()=>choose(x.id);$('list').append(b)}}function choose(id){const x=data.find(x=>x.id===id);if(!x)return;selected=id;$('heading').textContent=x.title;for(const f of fields)$(f).value=x[f]||'';$('price').value=x.price??'';$('category').replaceChildren(...[...new Set(data.map(x=>x.category))].map(c=>new Option(c,c)));$('category').value=x.category;$('link').textContent=x.href;render()}$('editor').onsubmit=e=>{e.preventDefault();const x=data.find(x=>x.id===selected);if(!x)return;for(const f of fields)x[f]=$(f).value.trim();x.category=$('category').value;if($('price').value==='')delete x.price;else x.price=Number($('price').value);store();choose(selected)};$('search').oninput=render;$('export').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='tours.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);$('status').textContent='تم تجهيز الملف؛ ارفعه إلى data/tours.json للنشر.'};$('reset').onclick=()=>{if(confirm('استعادة البيانات الأصلية وحذف المسودة المحلية؟')){data=structuredClone(seed);store();choose(data[0].id)}};$('import').onchange=async e=>{try{const v=JSON.parse(await e.target.files[0].text());if(!Array.isArray(v)||v.length!==seed.length||new Set(v.map(x=>x.id)).size!==seed.length||!seed.every(x=>v.some(y=>y.id===x.id&&y.href===x.href&&typeof y.title==='string'&&typeof y.category==='string'&&(y.price===undefined||typeof y.price==='number'&&Number.isFinite(y.price)&&y.price>=0))))throw Error();data=v;store();choose(data[0].id)}catch{$('status').textContent='ملف غير صالح أو روابط الرحلات غير مطابقة.'}};choose(data[0].id);</script></html>
